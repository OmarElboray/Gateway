<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanks | The Gateway Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="gateway-icon.svg">

    <style>
        :root {
            --bg: #fffcf0;
            --ink: #0f172a;
            --block-blue: #93c5fd;
            --block-green: #6ee7b7;
            --block-yellow: #fde047;
            --block-pink: #f9a8d4;
        }
        body { background-color: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; margin: 0; }
        .happy-card { background: white; border: 4px solid var(--ink); box-shadow: 8px 8px 0px var(--ink); }
        .happy-btn { background: var(--block-green); color: var(--ink); border: 4px solid var(--ink); box-shadow: 6px 6px 0px var(--ink); font-weight: 800; transition: all 0.15s ease-out; }
        .happy-btn:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0px var(--ink); background: var(--block-yellow); }
        .highlight { position: relative; display: inline-block; z-index: 1; }
        .highlight::after { content: ""; position: absolute; bottom: 4px; left: -2px; right: -2px; height: 12px; background: var(--block-yellow); z-index: -1; transform: rotate(-1deg); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">
    <div class="happy-card p-10 md:p-16 max-w-xl w-full text-center">
        <h1 class="text-4xl md:text-5xl font-black mb-6">Got it. <span class="highlight">Thanks.</span></h1>
        <p class="text-slate-600 font-medium text-lg mb-10">
            Your request just landed in our inbox. We'll get back to you soon.
        </p>
        <a href="index.html" class="hover-trigger happy-btn inline-block px-8 py-4 text-lg uppercase tracking-wide">
            Back to Gateway
        </a>
    </div>
</body>
</html>
